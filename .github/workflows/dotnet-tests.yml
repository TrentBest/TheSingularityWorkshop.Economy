name: .NET Tests

on:
  push:
    branches: [development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.x
      - name: Restore
        run: |
          dotnet restore src/TheSingularityWorkshop.Economy/TheSingularityWorkshop.Economy.csproj
          dotnet restore tests/TheSingularityWorkshop.Economy.Tests/TheSingularityWorkshop.Economy.Tests.csproj
      - name: Build
        run: dotnet build src/TheSingularityWorkshop.Economy/TheSingularityWorkshop.Economy.csproj --configuration Release --no-restore
      - name: Test
        run: dotnet test tests/TheSingularityWorkshop.Economy.Tests/TheSingularityWorkshop.Economy.Tests.csproj --configuration Release --no-restore
      - name: Pack (without publishing)
        run: dotnet pack src/TheSingularityWorkshop.Economy/TheSingularityWorkshop.Economy.csproj --configuration Release --no-build --no-restore --output artifacts
      - name: Verify packaged documentation
        run: |
          package=$(find artifacts -maxdepth 1 -name '*.nupkg' -print -quit)
          test -n "$package"
          unzip -Z1 "$package" | grep -Fxq 'README.md'
          unzip -Z1 "$package" | grep -Fxq 'docs/GETTING_STARTED.md'
          unzip -Z1 "$package" | grep -Fxq 'docs/THEORY/README.md'
          unzip -Z1 "$package" | grep -Fxq 'docs/THEORY/02-PREDICTION-MARKETS-AND-WAGERING.md'
          unzip -Z1 "$package" | grep -Fxq 'docs/THEORY/03-TEAMS-LEAGUES-AND-TOURNAMENTS.md'
          unzip -Z1 "$package" | grep -Fxq 'docs/API/README.md'
          unzip -Z1 "$package" | grep -Fxq 'docs/API/SimulationLedger.md'
          unzip -Z1 "$package" | grep -Fxq 'docs/UML/README.md'
          unzip -Z1 "$package" | grep -Fxq 'docs/UML/SimulationLedgerUML.md'
          unzip -Z1 "$package" | grep -Fxq 'docs/UML/BlackjackRoundUML.md'
          unzip -Z1 "$package" | grep -Fxq 'docs/UML/BlackjackWagerIntegrationUML.md'
          unzip -Z1 "$package" | grep -Fxq 'docs/UML/BlackjackSessionUML.md'
          unzip -Z1 "$package" | grep -Fxq 'docs/UML/BlackjackSessionOpeningUML.md'
          unzip -Z1 "$package" | grep -Fxq 'docs/UML/CompetitionUML.md'
